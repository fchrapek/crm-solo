# Ports bind to 127.0.0.1: Docker's short "3306:3306" syntax listens on every
# interface and writes its own firewall rules, which would open the database to
# the LAN behind a password this repository publishes.
#
# Names and ports key off COMPOSE_PROJECT_NAME and the variables Laravel reads,
# so a second checkout that changes DB_PORT cannot silently connect to this
# one's database.
services:
    nginx:
        image: nginx:alpine
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-nginx
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PROXY_PORT:-8080}:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - crm-solo

    mariadb:
        image: mariadb:11.4
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-mariadb
        restart: unless-stopped
        ports:
            - '127.0.0.1:${DB_PORT:-33061}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: secret
            MARIADB_DATABASE: crm_solo
            MARIADB_USER: crm_solo
            MARIADB_PASSWORD: secret
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - crm-solo

    valkey:
        image: valkey/valkey:8-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-valkey
        restart: unless-stopped
        ports:
            - '127.0.0.1:${REDIS_PORT:-63790}:6379'
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - crm-solo

    mailpit:
        image: axllent/mailpit:latest
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-mailpit
        restart: unless-stopped
        ports:
            - '127.0.0.1:${MAIL_PORT:-10250}:1025'
            - '127.0.0.1:${MAIL_UI_PORT:-18025}:8025'
        networks:
            - crm-solo

networks:
    crm-solo:
        driver: bridge

volumes:
    mariadb_data:
    valkey_data:
