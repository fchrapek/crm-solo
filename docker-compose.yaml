# Container names key off COMPOSE_PROJECT_NAME and the published ports read
# the same variables Laravel does, so a second checkout that changes DB_PORT
# in its .env moves the container with it. Without that, two checkouts publish
# the same port: the second stack fails to bind, and its app silently talks to
# the first one's database on identical .env.example credentials.
services:
    nginx:
        image: nginx:alpine
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-nginx
        restart: unless-stopped
        ports:
            - '${APP_PROXY_PORT:-8080}:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - crm-solo

    mariadb:
        image: mariadb:11.4
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-mariadb
        restart: unless-stopped
        ports:
            - '${DB_PORT:-33061}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: secret
            MARIADB_DATABASE: crm_solo
            MARIADB_USER: crm_solo
            MARIADB_PASSWORD: secret
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - crm-solo

    valkey:
        image: valkey/valkey:8-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-valkey
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-63790}:6379'
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - crm-solo

    mailpit:
        image: axllent/mailpit:latest
        container_name: ${COMPOSE_PROJECT_NAME:-crm-solo}-mailpit
        restart: unless-stopped
        ports:
            - '${MAIL_PORT:-10250}:1025'
            - '${MAIL_UI_PORT:-18025}:8025'
        networks:
            - crm-solo

networks:
    crm-solo:
        driver: bridge

volumes:
    mariadb_data:
    valkey_data:
