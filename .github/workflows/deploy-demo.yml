name: Deploy Demo

# demo.crm-solo.com runs the public repository. A push to main of
# fchrapek/crm-solo builds the image, redeploys, and reseeds the fictional
# dataset via demo:reset, so the demo never accumulates visitor edits (it also
# self-heals nightly via the scheduler). The private repository carries this
# file verbatim, which is why the jobs check the repository name: there it
# stays inert. Secrets live in the public repo's `demo` environment, which
# only main may use. The CI gate runs first, on the same commit, and a
# failure stops the build and the deploy.

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate:
    if: github.repository == 'fchrapek/crm-solo'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: gate
    if: github.repository == 'fchrapek/crm-solo'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.prod
          target: app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.repository == 'fchrapek/crm-solo'
    runs-on: ubuntu-24.04
    environment: demo

    steps:
      - name: Refuse to run without a deploy target
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH is not set in the demo environment; refusing to deploy into a default directory."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync compose file to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: compose.demo.yaml
          target: ${{ secrets.DEPLOY_PATH }}/

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # The target is provisioned by hand, once; the workflow never creates it.
            if [ ! -f .env ] || ! grep -Eq '^DEMO_IMAGE=.+' .env; then
              echo "Deploy target is not provisioned: expected a .env with DEMO_IMAGE set."
              exit 1
            fi
            echo "Deploy target is provisioned (.env present, DEMO_IMAGE set)."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f compose.demo.yaml pull
            docker compose -f compose.demo.yaml up -d --remove-orphans

            # note: the remote shell is zsh, where $status is read-only
            for i in $(seq 1 30); do
              app_health=$(docker inspect -f '{{.State.Health.Status}}' crm-solo-demo-app 2>/dev/null || echo starting)
              [ "$app_health" = "healthy" ] && break
              sleep 5
            done

            docker compose -f compose.demo.yaml exec -T app php artisan demo:reset
            docker compose -f compose.demo.yaml exec -T app php artisan config:cache
            docker compose -f compose.demo.yaml exec -T app php artisan route:cache
            docker compose -f compose.demo.yaml exec -T app php artisan view:cache

            echo "Demo deployed and reseeded."
