name: Pull request

# Every change reaches develop through a pull request that merges itself
# when the CI gate and the title check pass: squashed, the PR title as the
# commit subject. The free plan has no branch protection, so this is
# hygiene, not enforcement: anyone with write access can still merge by
# hand. A pull request that touches the gate itself (workflows, check
# script, hooks, the public export policy) is never merged by the bot; a
# person merges it.
#
# Hold one back with the `hold` label or as a draft; removing the label,
# marking it ready or fixing the title runs the checks again and merges.
# Other label changes and body edits start nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled, edited]

# An irrelevant event gets its own group, so it never cancels a real run.
concurrency:
  group: >-
    pr-${{ github.event.pull_request.number }}-${{
    ((github.event.action != 'unlabeled' && github.event.action != 'edited')
    || github.event.label.name == 'hold'
    || github.event.changes.title != null
    || github.event.changes.base != null)
    && 'checks' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Into develop, a docs-only change skips the app checks and the export
  # self-test runs only when the export policy could have changed. Into main
  # nothing is skipped. The export scan below always runs. Unknown means run.
  classify:
    name: Changed files
    if: >-
      github.event.repository.private
      && ((github.event.action != 'unlabeled' && github.event.action != 'edited')
      || github.event.label.name == 'hold'
      || github.event.changes.title != null
      || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_checks: ${{ steps.decide.outputs.app_checks }}
      export_self_test: ${{ steps.decide.outputs.export_self_test }}
    steps:
      - name: Decide what this change needs
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          app=true
          selftest=true
          if [ "$BASE" = "develop" ]; then
            expected=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.changed_files')
            listing=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            if [ "$(grep -c . <<<"$listing" || true)" -ne "$expected" ]; then
              echo "::error::Could not list all $expected changed files."; exit 1
            fi
            # Both sides of a rename count.
            names=$(tr '\t' '\n' <<<"$listing" | grep . || true)
            if [ -n "$names" ] && ! grep -vqE '^(docs/|[^/]+\.md$)' <<<"$names"; then
              app=false
            fi
            if ! grep -qE '^(scripts/public-export(\.sh$|/)|\.github/|resources/fonts/)|(^|/)\.gitattributes$' <<<"$names"; then
              selftest=false
            fi
          fi
          echo "app_checks=$app" >> "$GITHUB_OUTPUT"
          echo "export_self_test=$selftest" >> "$GITHUB_OUTPUT"
          echo "App checks: $app. Export self-test: $selftest."

  gate:
    needs: classify
    if: >-
      !cancelled()
      && ((github.event.action != 'unlabeled' && github.event.action != 'edited')
      || github.event.label.name == 'hold'
      || github.event.changes.title != null
      || github.event.changes.base != null)
    uses: ./.github/workflows/ci.yml
    with:
      app_checks: ${{ needs.classify.outputs.app_checks != 'false' }}
      export_self_test: ${{ needs.classify.outputs.export_self_test != 'false' }}
    permissions:
      contents: read

  # A release PR into main merges with GitHub's own merge-commit subject, so
  # its title is not checked.
  title:
    name: Title in house style
    if: >-
      github.event.pull_request.base.ref != 'main'
      && ((github.event.action != 'unlabeled' && github.event.action != 'edited')
      || github.event.label.name == 'hold'
      || github.event.changes.title != null
      || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/hooks/commit-msg.sh --subject "$TITLE"

  # The release's export and security stage on the tested merge, read-only; its policy is export-ignored, so the public snapshot skips it.
  export:
    name: Public export security stage
    if: >-
      github.event.repository.private
      && ((github.event.action != 'unlabeled' && github.event.action != 'edited')
      || github.event.label.name == 'hold'
      || github.event.changes.title != null
      || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned by checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      # Hits go to the report dir, never the log; reproduce them locally.
      - name: Export and run every gate
        run: scripts/public-export.sh --report-dir "$RUNNER_TEMP/report" HEAD "$RUNNER_TEMP/public-tree"

      - name: How to see the hits
        if: failure()
        run: echo "::error::Run scripts/public-export.sh --report-dir <dir>/rep <sha> <dir>/pub locally on this branch and read <dir>/rep/hits-*.txt."

  # By visibility, not repository name, so the public snapshot names nothing private; forks are private too.
  merge:
    name: Merge when green
    needs: [classify, gate, title, export]
    # A skipped gate passes only as the docs-only outcome classify decided.
    if: >-
      !cancelled()
      && github.event.repository.private && !github.event.repository.fork
      && github.event.pull_request.base.ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.classify.result == 'success'
      && needs.title.result == 'success'
      && needs.export.result == 'success'
      && (needs.gate.result == 'success'
        || (needs.gate.result == 'skipped'
          && needs.classify.outputs.app_checks == 'false'
          && needs.classify.outputs.export_self_test == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One merge at a time, so a second green PR sees the first one's merge
    # and fails the stale-base check instead of landing on an untested base.
    concurrency:
      group: merge-develop
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write

    steps:
      - name: Merge, unless held, stale or touching the gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Read live, not from the event: a label or draft set while the
          # checks ran still holds the merge.
          live=$(gh api "repos/$GH_REPO/pulls/$PR")
          if [ "$(jq -r '.state' <<<"$live")" != "open" ]; then
            echo "Pull request is no longer open."; exit 0
          fi
          if [ "$(jq -r '.draft' <<<"$live")" = "true" ] \
            || jq -e '.labels[] | select(.name == "hold")' <<<"$live" >/dev/null; then
            echo "::notice::Held (draft or the hold label); not merging."; exit 0
          fi

          # The full file list, failing closed: an error or a short list stops
          # the merge instead of letting a gate change through.
          listing=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
          expected=$(jq -r '.changed_files' <<<"$live")
          if [ "$(grep -c . <<<"$listing" || true)" -ne "$expected" ]; then
            echo "::error::Could not list all $expected changed files; a person merges this one."; exit 1
          fi
          files=$(tr '\t' '\n' <<<"$listing" | grep . || true)
          gated=$(grep -E '^(\.github/|scripts/check\.sh$|scripts/hooks/|scripts/public-export|lefthook\.yml$)|(^|/)\.gitattributes$' <<<"$files" || true)
          if [ -n "$gated" ]; then
            echo "::notice::This pull request changes the gate, so a person merges it:"
            printf '%s\n' "$gated"
            exit 0
          fi

          # The checks ran on a merge of the PR into the develop of that
          # moment. If develop has moved since, that result says nothing
          # about the merge that would happen now.
          tested_base=$(gh api "repos/$GH_REPO/commits/$TESTED_SHA" --jq '.parents[0].sha')
          develop=$(gh api "repos/$GH_REPO/branches/develop" --jq '.commit.sha')
          if [ "$tested_base" != "$develop" ]; then
            echo "::error::develop moved since these checks ran; push to the branch (or close and reopen the PR) to check it again."
            exit 1
          fi

          # --match-head-commit refuses the merge if anything was pushed
          # after the commit these checks ran on.
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA" --subject "$TITLE"

          # The merge was pushed with GITHUB_TOKEN, which starts no workflow;
          # a dispatch is the exception, so develop still gets its run and its
          # release pull request. If this run is cancelled before the dispatch,
          # run `gh workflow run deploy.yml --ref develop` by hand.
          # The "Verified merge" status lets develop skip the gate, and is set
          # only when the squash is provably the tree tested here on the base
          # tested here; without it develop runs everything.
          if merged=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.merge_commit_sha') \
            && tested_tree=$(gh api "repos/$GH_REPO/commits/$TESTED_SHA" --jq '.commit.tree.sha') \
            && squash=$(gh api "repos/$GH_REPO/commits/$merged" --jq '[(.parents | length), .parents[0].sha, .commit.tree.sha] | @tsv') \
            && [ "$squash" = "$(printf '1\t%s\t%s' "$tested_base" "$tested_tree")" ]; then
            gh api -X POST "repos/$GH_REPO/statuses/$merged" -f state=success -f context="Verified merge" \
              -f description="Squash equals the merge pr.yml tested" >/dev/null \
              || echo "::notice::Could not set the Verified merge status; develop runs the full gate."
          else
            echo "::notice::The squash could not be matched to the tested merge; develop runs the full gate."
          fi
          gh workflow run deploy.yml --ref develop
